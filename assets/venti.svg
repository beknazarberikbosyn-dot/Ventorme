  <path d="M136 150l8 90h-22l-10-74z" fill="none" stroke="#ffd166" stroke-width="2" opacity=".7"/>
  <path d="M81 214l6 10 6-10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
