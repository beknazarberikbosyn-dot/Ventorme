  <path d="M168 234c28-2 44-24 40-50-1-8-6-14-12-16" fill="none" stroke="url(#fur)" stroke-width="18" stroke-linecap="round"/>
  <g fill="#4a5262"><circle cx="204" cy="200" r="4"/><circle cx="194" cy="222" r="3.5"/><path d="M196 172a6 6 0 0 1 8 2" stroke="#4a5262" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>

  <!-- мантия -->
  <path d="M30 240c-2-40 8-70 34-84 14-8 28-11 46-11s32 3 46 11c26 14 36 44 34 84z" fill="url(#gown)"/>
