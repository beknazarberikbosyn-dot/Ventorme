<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-label="Venti — снежный барс в выпускной шапочке и мантии">
  <defs>
    <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d63"/>
      <stop offset="1" stop-color="#1a1f48"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#e2e7ef"/>
    </linearGradient>
    <radialGradient id="eye" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#c9e2ea"/>
      <stop offset="1" stop-color="#7fa9bd"/>
    </radialGradient>
  </defs>

  <!-- хвост -->
