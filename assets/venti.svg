  <circle cx="62" cy="76" r="19" fill="#3b4250"/>
  <circle cx="62" cy="78" r="16" fill="url(#fur)"/>
  <circle cx="63" cy="80" r="9" fill="#e7c9cf"/>
  <circle cx="158" cy="76" r="19" fill="#3b4250"/>
  <circle cx="158" cy="78" r="16" fill="url(#fur)"/>
  <circle cx="157" cy="80" r="9" fill="#e7c9cf"/>

