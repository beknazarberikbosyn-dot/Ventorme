  <ellipse cx="99" cy="138" rx="15" ry="12" fill="#fff"/>
  <ellipse cx="121" cy="138" rx="15" ry="12" fill="#fff"/>
  <g fill="#9aa3b2"><circle cx="93" cy="137" r="1.6"/><circle cx="99" cy="141" r="1.6"/><circle cx="93" cy="143" r="1.6"/><circle cx="127" cy="137" r="1.6"/><circle cx="121" cy="141" r="1.6"/><circle cx="127" cy="143" r="1.6"/></g>
