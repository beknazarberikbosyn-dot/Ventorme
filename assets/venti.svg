  <ellipse cx="158" cy="228" rx="16" ry="12" fill="url(#fur)" stroke="#c9d0dc" stroke-width="2"/>
  <path d="M56 226v6M62 225v7M68 226v6M152 226v6M158 225v7M164 226v6" stroke="#b4bccb" stroke-width="2" stroke-linecap="round"/>

